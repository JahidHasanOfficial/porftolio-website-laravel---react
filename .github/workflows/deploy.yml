name: CI/CD Pipeline - Test, Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # 1. CI (Continuous Integration): Automated Testing
  # -------------------------------------------------------------
  test:
    name: 🧪 Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, bcmath, curl, zip, gd, fileinfo
          coverage: none

      - name: Copy .env.example to .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate App Key
        run: php artisan key:generate

      - name: Run PHPUnit Tests
        run: php vendor/phpunit/phpunit/phpunit

  # -------------------------------------------------------------
  # 2. CD (Continuous Deployment): Live Deployment & Cache Clear
  # -------------------------------------------------------------
  deploy:
    name: 🚀 Deploy to Production Server
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Live Server Deployment
        run: |
          echo "Initiating production deployment to engineerjahid.xyz..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://engineerjahid.xyz/deploy-webhook.php?token=portfolio_deploy_secret_key_84920482")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          
          echo "Server Response:"
          echo "$BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Deployment failed with HTTP status: $HTTP_STATUS"
            exit 1
          fi
          
          echo "✅ Deployment completed successfully!"
